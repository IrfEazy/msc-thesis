[project]
name = "msc-thesis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.16.0",
    "hyperopt>=0.3.0",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydot>=4.0.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scikit-multilearn>=0.2.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "typing-extensions>=4.16.0",
    "wordcloud>=1.9.6",
    "xgboost>=3.4.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
]

# Declarative configuration of the relevance-filter experiment (notebooks/filter.ipynb, notebooks/filtering.py).
# Project values live here; filtering.py is generic. Changing anything here changes the checkpoint identity.

[selection]
# Candidates = embedders x families (thesis: 7 x 4 = 28), each a StandardScaler + classifier Pipeline.
embedders = ["GloVe.6B.50D", "GloVe.6B.100D", "GloVe.6B.200D", "GloVe.6B.300D", "DistilRoBERTa", "SBERT", "ATT&CK-BERT"]
families = ["lr", "gnb", "rf", "xgb"]
cv_folds = 5            # must equal the number of manifest inner folds
metric = "balanced_accuracy"  # selection metric (mean over the grouped folds); ties: lower std, then name

[tuning]
max_evals = 100         # hyperopt TPE evaluations of the selected candidate's family (CV on train only)
metric = "balanced_accuracy"

[bootstrap]
# 95% percentile bootstrap CIs of the test and Cotov metrics: test resamples whole manifest groups,
# Cotov (no groups) resamples rows. Seeded and independent of RANDOM_STATE.
B = 1000
seed = 20241101
level = 0.95

[smoke]
# FILTER_SMOKE=1: a tiny NON-PRODUCTION check of the whole flow; never writes the production outputs.
embedders = ["GloVe.6B.50D", "GloVe.6B.100D"]
families = ["lr", "gnb", "xgb"]
max_evals = 2
bootstrap_B = 50

# Fixed (untuned) constructor arguments per family. random_state is added when the estimator
# accepts it; xgb additionally gets device=device.select_device().
[families.lr]
estimator = "LogisticRegression"
params = { solver = "liblinear", max_iter = 1000 }

[families.gnb]
estimator = "GaussianNB"
params = {}

[families.rf]
estimator = "RandomForestClassifier"
params = { n_jobs = -1 }

[families.xgb]
estimator = "XGBClassifier"
params = { objective = "binary:logistic", n_jobs = -1 }

# Hyperopt search spaces per family. type: uniform | quniform | loguniform (low/high are the real
# bounds, not their logarithms) | choice (options). int = true casts the sampled value to int.
[spaces.xgb.n_estimators]
type = "quniform"
low = 100
high = 1000
q = 1
int = true
[spaces.xgb.max_depth]
type = "quniform"
low = 2
high = 12
q = 1
int = true
[spaces.xgb.learning_rate]
type = "uniform"
low = 0.01
high = 0.3
[spaces.xgb.gamma]
type = "uniform"
low = 0.0
high = 0.5
[spaces.xgb.min_child_weight]
type = "quniform"
low = 1
high = 10
q = 1
[spaces.xgb.subsample]
type = "uniform"
low = 0.5
high = 1.0
[spaces.xgb.colsample_bytree]
type = "uniform"
low = 0.5
high = 1.0

[spaces.rf.n_estimators]
type = "quniform"
low = 100
high = 600
q = 10
int = true
[spaces.rf.max_depth]
type = "quniform"
low = 4
high = 40
q = 1
int = true
[spaces.rf.min_samples_split]
type = "quniform"
low = 2
high = 20
q = 1
int = true
[spaces.rf.min_samples_leaf]
type = "quniform"
low = 1
high = 10
q = 1
int = true
[spaces.rf.max_features]
type = "choice"
options = ["sqrt", "log2"]

[spaces.lr.C]
type = "loguniform"
low = 0.0001
high = 100.0
# penalty is not searched: sklearn >= 1.8 deprecates it (default L2 with liblinear).

[spaces.gnb.var_smoothing]
type = "loguniform"
low = 1e-12
high = 1e-3

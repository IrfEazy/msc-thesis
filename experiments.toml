# Relevance filter (notebooks/filter.ipynb, config notebooks/filter.toml): reads only the shared split and the embedding
# artifacts of the "Embeddings" kernel; a CPU kernel with trial/candidate checkpoints (CHECKPOINT_DIR in outputs_dirs).
# COTOV_CSV is kept only for the Related labels of the Cotov evaluation (the features come from the cotov artifacts).
[[notebooks]]
name = "filter"
path = "notebooks/filter.ipynb"
target = "kaggle"
accelerator = "none"
notes = "28 candidates x 5 grouped folds, then max_evals (filter.toml) x 5 folds on the selected family; stops cleanly (INCOMPLETE) at the checkpoint budget and resumes from the checkpoints."

[notebooks.env]
ROOT = "{repo}"
RANDOM_STATE = "42"
OVERWRITE = "true"
SPLIT_MANIFEST_CSV = "{input:msc-thesis-data}/splits/split_manifest.csv"
SPLIT_TRAIN_CSV = "{input:msc-thesis-data}/splits/split_train.csv"
SPLIT_TEST_CSV = "{input:msc-thesis-data}/splits/split_test.csv"
SPLIT_MANIFEST_SHA256 = "9f8b62852c14bccca294ea4c3bf1b5c554bb5272e2b066ba3d103d77041d76a0"
EMBEDDINGS_DIR = "{input:msc-thesis-embeddings}/embeddings"
CHECKPOINT_DIR = "{working}/checkpoints"
CHECKPOINT_BUDGET_HOURS = "11"
CHECKPOINT_MARGIN_MINUTES = "60"
FILTERS_PERFORMANCES_CSV = "{working}/models/filters_performances.csv"
OPTIMAL_FILTER_PICKLE = "{working}/models/filter.pkl"
COTOV_CSV = "{input:anastasias-twitter-dataset}/anastasia.csv"


# Two-Step and One-Step categorisation (notebooks/categorisation.ipynb, config notebooks/categorisation.toml): one parametrised
# notebook, CATEGORISATION_LEVEL selects the level ("one step" = One-Step top level on all posts). Chained CPU kernels per level: train shards (STAGE=train,
# EMBEDDERS = the shard) attach "msc-thesis-embeddings"; one assemble kernel per level attaches its shards
# (CHECKPOINT_INPUTS) and writes the categoriser under {working}/models. The shards of a level share one checkpoint
# identity (EMBEDDERS is not hashed). Sparse levels (hardware, operating systems, software) abort in the data cell
# with a SPARSE LEVEL message if a fold has no labelset with >= 20 rows; see notebooks/rebuild.md.


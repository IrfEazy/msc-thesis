# Per-notebook run manifest read by scripts/run_notebooks.py (declarative policy only).
#
# Placeholders {repo} (absolute repo root) and {run_dir} (absolute output dir of a run) are
# substituted in cwd, env, inputs and outputs. Relative cwd/inputs/outputs resolve against {repo}.
# Variables already set in the runner's process environment win over the values below.
#
# Unavailable datasets: COTOV_CSV (the Cotov/NistPosts dataset) is not set anywhere because the
# dataset is unrecoverable. Notebook sections that need such data print a 'BLOCKED: ...' line and
# are skipped; the runner reports the notebook as 'passed-with-blocked'.

[settings]
runs_dir = "runs"
kernel = "python3"
timeout = 3600  # per-cell seconds

[env]
# Defaults applied to every notebook.

[[archives]]
path = "data/tweets-dataset.zip"
dest = "data/tweets-dataset"

[[archives]]
path = "data/tweets-dataset-for-cyberattack-detection.zip"
dest = "data/tweets-dataset-for-cyberattack-detection"

# RANDOM_STATE: the thesis states no seed; MLC_Notebook defaults to 42.
# Outputs go under {run_dir}/data so the extracted originals are never overwritten.
[[notebooks]]
name = "Train-Test split"
path = "notebooks/Train-Test split.ipynb"
target = "local"
cwd = "{repo}"
inputs = ["{repo}/data/tweets-dataset-for-cyberattack-detection/tweets_final.csv"]
outputs = [
  "{run_dir}/data/filter_train.csv",
  "{run_dir}/data/filter_test.csv",
  "{run_dir}/data/categories_train.csv",
  "{run_dir}/data/categories_test.csv",
]


[notebooks.env]
ROOT = "{repo}"
TEST_SIZE = "0.2"
RANDOM_STATE = "42"
TWEETS_CSV = "{repo}/data/tweets-dataset-for-cyberattack-detection/tweets_final.csv"
FILTER_TRAIN_CSV = "{run_dir}/data/filter_train.csv"
FILTER_TEST_CSV = "{run_dir}/data/filter_test.csv"
TEMP_CATEGORIES_TRAIN_CSV = "{run_dir}/data/categories_train.csv"
TEMP_CATEGORIES_TEST_CSV = "{run_dir}/data/categories_test.csv"

[[notebooks]]
name = "MultiLabelClassification"
path = "notebooks/MultiLabelClassification.ipynb"
target = "local"
cwd = "{repo}"
inputs = ["data/tweets-dataset-for-cyberattack-detection/sub_tweets_train.pkl"]
notes = "LOCAL_DIR=Path('./') so cwd is the repo root. Reads data/tweets-dataset-for-cyberattack-detection/sub_tweets_train.pkl, which no step here produces; reports blocked until the human provides it."


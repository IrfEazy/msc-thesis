# Per-notebook run manifest read by scripts/run_notebooks.py (declarative policy only).
#
# Placeholders {repo} (absolute repo root) and {run_dir} (absolute output dir of a run) are
# substituted in cwd, env, inputs and outputs. Relative cwd/inputs/outputs resolve against {repo}.
# Variables already set in the runner's process environment win over the values below.
#
# Unavailable datasets: COTOV_CSV (the Cotov/NistPosts dataset, data/anastasia.csv) is not set for
# local runs because the file is not in the repo; the Kaggle filter run gets it from the attached
# dataset irfancela/anastasias-twitter-dataset (see the filter entry). Notebook sections that need
# missing data print a 'BLOCKED: ...' line and are skipped; the runner reports the notebook as
# 'passed-with-blocked'.

# Kaggle bundles generated by scripts/kaggle_bundle.py (build / push / status / fetch).
# Staged runs (categorisation, incl. its One-Step level; MLC_Notebook was superseded and deleted): train-shard kernels and one assemble kernel per level (the embeddings kernel `msc-thesis-embeddings` is shared), all CPU kernels so
# every stage runs on the same image (module versions are part of the checkpoint identity).
# `kernels = [...]` in a notebook's [notebooks.kaggle] attaches those kernels' outputs; their mount is {input:<slug>}
# and a stage's checkpoint dir (CHECKPOINT_DIR={working}/checkpoints, listed in outputs_dirs) appears there as
# {input:<slug>}/checkpoints. CHECKPOINT_INPUTS lists these mounts (os.pathsep ':'-separated). Train shards stop
# at CHECKPOINT_BUDGET_HOURS minus CHECKPOINT_MARGIN_MINUTES and exit INCOMPLETE; see notebooks/AGENTS.md.
# Placeholders in kernel cwd, env and links: {repo} (repo dir recreated on Kaggle), {input:<slug>}
# (mount dir of attached dataset <slug>), {working} (Kaggle output dir).
[kaggle]
owner = "irfancela"
code_dataset = "msc-thesis-code"
data_dataset = "msc-thesis-data"
accelerator = "NvidiaTeslaT4"  # passed as `kaggle kernels push --accelerator`
build_dir = "build/kaggle"
code_license = "CC0-1.0"  # repo is Unlicense
data_license = "unknown"
max_gpu_sessions = 2  # push waits until fewer manifest kernels (any invocation) are RUNNING/QUEUED; retries on a session-limit rejection
max_cpu_sessions = 5  # local safety limit (not a Kaggle quota): same wait and session-limit retry as max_gpu_sessions, for CPU kernels
session_wait_timeout_minutes = 720  # push exits non-zero (never pushes) when no session slot frees within this time
gpu_poll_interval = 60  # seconds between status polls while waiting
# Commands (argv lists) the bootstrap runs after setup and before the notebook; {python} = the kernel interpreter.
# Notebooks never download NLTK data themselves and the Kaggle image lacks it.
# The NLTK command exits non-zero if any package download fails (python -m nltk.downloader exits 0 regardless), so the bootstrap fails fast.
setup_commands = [["{python}", "-c", "import nltk, sys; pkgs = sys.argv[1:]; failed = [p for p in pkgs if not nltk.download(p, quiet=True)]; sys.exit(f'nltk download failed: {failed}' if failed else 0)", "punkt", "punkt_tab", "wordnet", "omw-1.4", "stopwords", "averaged_perceptron_tagger", "averaged_perceptron_tagger_eng", "universal_tagset"]]
dataset_ready_timeout = 900  # seconds to wait for each pushed dataset to become ready
# Repo paths copied into the code dataset (directories: only *.py files).
code_paths = ["utils.py", "preprocess_functions.py", "device.py", "MLC", "notebooks/utils.py", "notebooks/checkpoints.py", "notebooks/textprep.py", "notebooks/taxonomy.py", "notebooks/taxonomy.toml", "notebooks/splits.py", "notebooks/embeddings.py", "notebooks/embedders.toml", "notebooks/filtering.py", "notebooks/filter.toml", "notebooks/categorisation.py", "notebooks/categorisation.toml", "requirements-kaggle.txt"]
# Copied into the data dataset.
data = [
  { src = "data/tweets-dataset", dest = "tweets-dataset" },
  # Deterministic outputs of `run_notebooks.py --only 'Train-Test split' --out runs/splits`.
  { src = "runs/splits/data", dest = "splits" },
]

[settings]
runs_dir = "runs"
kernel = "python3"
timeout = 3600  # per-cell seconds

[env]
# Defaults applied to every notebook.

[[archives]]
path = "data/tweets-dataset.zip"
dest = "data/tweets-dataset"

[[archives]]
path = "data/tweets-dataset-for-cyberattack-detection.zip"
dest = "data/tweets-dataset-for-cyberattack-detection"

# RANDOM_STATE 42 is fixed before any results exist and is never tuned (the notebook fails on
# any other seed unless SPLIT_ALLOW_OTHER_SEED=1, for tests). The split is grouped (duplicates
# and truncated copies stay together) and defined by notebooks/splits.py; downstream stages read
# the manifest and the split CSVs and pin its sha256.
# Outputs go under {run_dir}/data so the extracted originals are never overwritten.
[[notebooks]]
name = "Train-Test split"
path = "notebooks/Train-Test split.ipynb"
target = "local"
cwd = "{repo}"
inputs = ["{repo}/data/tweets-dataset-for-cyberattack-detection/tweets_final.csv"]
outputs = [
  "{run_dir}/data/split_manifest.csv",
  "{run_dir}/data/split_manifest.json",
  "{run_dir}/data/split_train.csv",
  "{run_dir}/data/split_test.csv",
]


[notebooks.env]
ROOT = "{repo}"
TEST_SIZE = "0.2"
RANDOM_STATE = "42"
TWEETS_CSV = "{repo}/data/tweets-dataset-for-cyberattack-detection/tweets_final.csv"
SPLIT_MANIFEST_CSV = "{run_dir}/data/split_manifest.csv"
SPLIT_TRAIN_CSV = "{run_dir}/data/split_train.csv"
SPLIT_TEST_CSV = "{run_dir}/data/split_test.csv"

# Shared embedding artifacts (notebooks/embeddings.py, embedders.toml): every corpus row (and the English
# Cotov rows when COTOV_CSV exists) is embedded once per embedder into EMBEDDINGS_DIR; downstream
# stages join by row id and verify fingerprints. SPLIT_MANIFEST_SHA256 is the pinned digest printed by
# Train-Test split. The local entry embeds the four GloVe embedders (files under embedders/, gitignored);
# transformers run on Kaggle (CPU kernel). Smoke: EMBED_SAMPLE_ROWS=N (artifacts marked NON-PRODUCTION).
[[notebooks]]
name = "Embeddings local"
path = "notebooks/Embeddings.ipynb"
target = "local"
cwd = "{repo}"
inputs = [
  "{repo}/runs/splits/data/split_manifest.csv",
  "{repo}/runs/splits/data/split_train.csv",
  "{repo}/runs/splits/data/split_test.csv",
  "{repo}/embedders/glove.6B.50d.txt",
  "{repo}/embedders/glove.6B.100d.txt",
  "{repo}/embedders/glove.6B.200d.txt",
  "{repo}/embedders/glove.6B.300d.txt",
]
outputs = ["{run_dir}/embeddings/corpus__GloVe.6B.50D.npy", "{run_dir}/embeddings/corpus__GloVe.6B.300D.json"]
notes = "GloVe embedders only; the transformers are embedded by the Kaggle entry."

[notebooks.env]
